<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a2744">
  <title>Assistant IA de diagnostic — LEBIATECH</title>
  <meta name="description" content="Assistant IA de diagnostic pour petites entreprises. Répondez à quelques questions et obtenez 3 pistes concrètes pour améliorer votre activité.">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2a4 4 0 0 1 4 4v2a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/><path d="M6 10v2a6 6 0 0 0 12 0v-2"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
        </div>
        <div>
          <h1 id="titre">Assistant IA de diagnostic</h1>
          <p class="sub">LEBIATECH · Diagnostic gratuit</p>
        </div>
      </div>
      <div class="ai-badge">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12l2 2 4-4"/></svg>
        Propulsé par IA
      </div>
    </div>
  </header>

  <div class="disclaimer">
    <div class="wrap">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="disclaimer">Je suis un assistant IA. Je vous pose quelques questions pour vous aider à prioriser vos actions. Je ne promets aucun résultat et ne donne aucun prix.</span>
    </div>
  </div>

  <main class="chat-area" id="chat-area">
    <div class="wrap">
      <div id="messages" class="messages"></div>
    </div>
  </main>

  <div class="input-bar" id="input-bar">
    <div class="wrap">
      <div class="quick-replies" id="quick-replies"></div>
      <div class="input-row">
        <input type="text" id="input-text" placeholder="Tapez votre réponse..." autocomplete="off">
        <button id="btn-send" class="btn-send" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="result-area" id="result-area" hidden>
    <div class="wrap">
      <div id="result-content"></div>
      <div class="result-actions">
        <a class="btn btn-primary" id="btn-reserver" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Réserver mon diagnostic gratuit
        </a>
        <a class="btn btn-wa" id="btn-whatsapp" href="#" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2z"/></svg>
          Contacter sur WhatsApp
        </a>
        <button class="btn btn-ghost" id="btn-recommencer">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Recommencer
        </button>
      </div>
    </div>
  </div>

  <div class="error-area" id="error-area" hidden>
    <div class="wrap">
      <div class="error-content">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <p id="error-text"></p>
      </div>
    </div>
  </div>

  <a class="fab-wa" id="error-wa" href="#" target="_blank" rel="noopener" aria-label="Contacter sur WhatsApp">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.85 9.85 0 0 0 12.04 2z"/></svg>
  </a>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
